; Mod Menus
[General]
; keyboard key that opens the list (DirectInput scan code; 197 = Pause, 0 = none)
uOpenKey = 197

[Keys]
; Each menu's key is read from its mod's own config file every time you pick it, so rebinding in that mod is enough.
; Only if a menu's key can't be read (or reads wrong), set it here by the entry's id, e.g.:
; obody = Shift+O
; oar = F11
